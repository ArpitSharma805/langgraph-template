name: Release templates

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Dev Containers CLI
        run: npm install -g @devcontainers/cli

      - name: Publish Template
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          devcontainer templates publish \
            -r ghcr.io \
            -n ArpitSharma805/langgraph-template \
            ./src/langgraph-template